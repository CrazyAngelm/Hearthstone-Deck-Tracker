name: Tavern original artwork export
on:
  push:
    branches: [tavern-art-export-20260916]
    paths: [.github/workflows/tavern-art-export.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install image decoder
        run: python -m pip install Pillow
      - name: Download and validate public artwork
        shell: python
        run: |
          import base64, concurrent.futures, hashlib, io, json, os, pathlib, urllib.request
          from PIL import Image
          out=pathlib.Path('tavern-original-art');out.mkdir();(out/'images').mkdir()
          ids='AT_064 AT_072 CS1_042 CS2_005 CS2_007 CS2_008 CS2_009 CS2_011 CS2_012 CS2_013 CS2_013t CS2_017 CS2_022 CS2_023 CS2_024 CS2_025 CS2_026 CS2_027 CS2_028 CS2_029 CS2_031 CS2_032 CS2_033 CS2_034 CS2_037 CS2_039 CS2_041 CS2_042 CS2_045 CS2_046 CS2_049 CS2_050 CS2_051 CS2_052 CS2_056 CS2_057 CS2_061 CS2_062 CS2_063 CS2_064 CS2_065 CS2_072 CS2_073 CS2_074 CS2_075 CS2_076 CS2_077 CS2_080 CS2_082 CS2_083b CS2_084 CS2_102 CS2_103 CS2_104 CS2_105 CS2_106 CS2_108 CS2_112 CS2_114 CS2_117 CS2_118 CS2_119 CS2_120 CS2_121 CS2_122 CS2_124 CS2_125 CS2_127 CS2_131 CS2_141 CS2_142 CS2_147 CS2_150 CS2_155 CS2_162 CS2_168 CS2_171 CS2_172 CS2_173 CS2_179 CS2_182 CS2_186 CS2_187 CS2_189 CS2_196 CS2_197 CS2_200 CS2_213 CS2_222 CS2_226 CS2_232 CS2_233 CS2_236 CS2_237 CS2_boar CS2_mirror CS2_tk1 DS1_055 DS1_070 DS1_175 DS1_178 DS1_183 DS1_184 DS1_185 DS1h_292 EX1_007 EX1_008 EX1_011 EX1_015 EX1_019 EX1_023 EX1_025 EX1_025t EX1_032 EX1_066 EX1_084 EX1_096 EX1_097 EX1_110 EX1_110t EX1_124 EX1_129 EX1_131 EX1_131t EX1_134 EX1_154 EX1_160 EX1_160t EX1_164 EX1_165 EX1_165t1 EX1_165t2 EX1_166 EX1_169 EX1_201 EX1_238 EX1_244 EX1_245 EX1_246 EX1_248 EX1_259 EX1_275 EX1_277 EX1_278 EX1_279 EX1_284 EX1_287 EX1_289 EX1_294 EX1_298 EX1_302 EX1_306 EX1_308 EX1_309 EX1_310 EX1_317 EX1_317t EX1_319 EX1_391 EX1_399 EX1_400 EX1_402 EX1_407 EX1_408 EX1_409 EX1_409t EX1_410 EX1_414 EX1_506 EX1_506a EX1_508 EX1_531 EX1_534 EX1_534t EX1_536 EX1_538 EX1_538t EX1_539 EX1_556 EX1_556t EX1_559 EX1_564 EX1_565 EX1_575 EX1_581 EX1_582 EX1_586 EX1_587 EX1_593 EX1_596 EX1_603 EX1_604 EX1_606 EX1_608 EX1_610 EX1_612 EX1_617 EX1_tk11 FP1_021 GAME_005 GVG_053 HERO_01 HERO_02 HERO_03 HERO_05 HERO_06 HERO_07 HERO_08 NEW1_003 NEW1_004 NEW1_007 NEW1_009 NEW1_011 NEW1_012 NEW1_019 NEW1_020 NEW1_031 NEW1_032 NEW1_033 NEW1_034 OG_149 hexfrog'.split()
          aliases={'CS2_034':'HERO_08bp','CS2_102':'HERO_01bp','DS1h_292':'HERO_05bp','CS2_083b':'HERO_03bp','CS2_056':'HERO_07bp','CS2_017':'HERO_06bp','CS2_049':'HERO_02bp'}
          def get(url):
            req=urllib.request.Request(url,headers={'User-Agent':'Tavern-Personal-Prototype-Asset-Bundler/9'})
            with urllib.request.urlopen(req,timeout=12) as r:return r.read(),dict(r.headers)
          def one(id):
            errors=[]
            variants=[id]+([aliases[id]] if id in aliases else [])
            urls=[f'https://art.hearthstonejson.com/v1/{folder}/{v}.{ext}' for v in variants for folder,ext in [('512x','jpg'),('orig','png'),('512x','webp')]]+[f'https://raw.githubusercontent.com/RedHatter/CardArt/master/assets/{v}.png' for v in variants]
            for url in urls:
              try:
                raw,headers=get(url);im=Image.open(io.BytesIO(raw));im.load()
                if min(im.size)<64 or im.convert('RGBA').getchannel('A').getbbox() is None:raise ValueError('invalid image')
                im.thumbnail((768,768));buf=io.BytesIO();im.save(buf,format='WEBP',quality=94,method=6);data=buf.getvalue()
                (out/'images'/f'{id}.webp').write_bytes(data)
                return id,{'url':url,'sha256':hashlib.sha256(data).hexdigest(),'sourceSha256':hashlib.sha256(raw).hexdigest(),'width':im.width,'height':im.height,'bytes':len(data),'cors':headers.get('access-control-allow-origin',headers.get('Access-Control-Allow-Origin'))},'data:image/webp;base64,'+base64.b64encode(data).decode()
              except Exception as e:errors.append(url+': '+str(e))
            return id,{'errors':errors},None
          records={};images={}
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
            for id,record,data in pool.map(one,ids):
              records[id]=record
              if data:images[id]=data
              print(id,'OK' if data else 'MISSING',flush=True)
          (out/'art-pack.json').write_text(json.dumps({'format':'tavern-art-pack-v1','credits':'Card art copyright Blizzard Entertainment; source HearthstoneJSON/RedHatter CardArt. Personal prototype.','images':images},separators=(',',':')))
          (out/'manifest.json').write_text(json.dumps({'required':len(ids),'ready':len(images),'missing':[id for id in ids if id not in images],'files':records},indent=2))
          try:
            raw,_=get('https://api.hearthstonejson.com/v1/latest/ruRU/cards.json');cards=json.loads(raw)
            (out/'reference-card-data.json').write_text(json.dumps([c for c in cards if c['id'] in ids],ensure_ascii=False,indent=2))
          except Exception as e:print('Card reference:',e)
          print('RESULT',len(images),'/',len(ids))
      - uses: actions/upload-artifact@v4
        with:
          name: tavern-original-art
          path: tavern-original-art/
          retention-days: 7
          if-no-files-found: error
